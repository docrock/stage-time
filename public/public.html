<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stage Time - Public</title>
<link rel="stylesheet" href="./st.css">
<style>
  /* View-specific layout only. Anything reusable lives in st.css. */

  /* The digits already size themselves from the container. ?scale= just multiplies
     that, so a lobby screen and an Ecamm widget box can share one URL. */
  .st-digits { font-size: calc(min(34cqw, 84cqh) * var(--st-scale, 1)); }
  .st-digits.wide { font-size: calc(min(23cqw, 70cqh) * var(--st-scale, 1)); }

  /* Session title hard left, wall clock hard right. */
  .st-top { justify-content: space-between; }
  .st-top .slot { min-width: 0; }
  .st-top .st-title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* Footer: the show brands the screen on the left, up next sits on the right. */
  .st-bottom { justify-content: space-between; }
  .st-bottom .show-title {
    font-weight: 700;
    color: var(--muted);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .st-bottom .st-upnext { text-align: right; }
  /* The up-next start time. A rundown is padded, so this is the time the outside
     world was told, not the internal projection. See timeSource() in the script. */
  .st-bottom .st-upnext .at {
    margin-left: 0.6em;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  /* Idle: no session selected. A calm standby card, never a fake 00:00. */
  .st-idle {
    text-align: center;
    padding: 0 6cqw;
  }
  .st-idle .show-title {
    font-size: min(7cqw, 16cqh);
    font-weight: 800;
    line-height: 1.1;
    color: var(--text);
  }
  .st-idle .standby {
    margin-top: 2cqh;
    font-size: min(3.4cqw, 8cqh);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="st-stage">

  <div class="st-top st-chrome" id="topStrip">
    <div class="slot st-title" id="sessionTitle"></div>
    <div class="slot st-clock" id="wallClock"></div>
  </div>

  <div class="st-timerbox">
    <div class="st-digits" id="digits" data-phase="idle" data-running="false"></div>
    <div class="st-idle" id="idle" hidden>
      <div class="show-title" id="idleShow"></div>
      <div class="standby">Standing by</div>
    </div>
  </div>

  <div class="st-bottom st-chrome" id="footer">
    <div class="show-title" id="showTitle"></div>
    <div class="st-upnext" id="upNext">
      <span class="st-label">Up next</span>
      <b id="nextTitle"></b>
      <span class="at" id="nextAt" hidden></span>
    </div>
  </div>

  <div class="st-progress" id="progress" data-phase="idle"><i id="progressFill"></i></div>
</div>

<div class="st-blackout" id="blackout" hidden></div>
<div class="st-offline" id="offline" hidden>OFFLINE</div>

<script type="module">
import * as ST from './st.js';

// transparent / chrome / flip, before the first paint so nothing flashes.
ST.applyChrome();

// --- URL parameters -------------------------------------------------------
// Each of these is ANDed with the matching operator toggle further down: the
// display can only show something both the URL and the operator allow.
const wantClock    = ST.opt('clock', true) !== false;
const wantUpNext   = ST.opt('upnext', true) !== false;
const wantProgress = ST.opt('progress', true) !== false;
const wantTitle    = ST.opt('title', true) !== false;
const transparent  = ST.opt('transparent', false) === true;

// ?times=live | ?times=published pins this output to one clock regardless of the
// operator's settings, so a single screen can be forced either way.
const timesParam = ST.opt('times', null);

// This view faces the audience and the stream. That is the whole reason it holds
// the published schedule by default.
const PUBLIC_FACING = true;

// --- which clock a view uses ---------------------------------------------
// Mirrors PUB.timeSource() in lib/publish.js. lib/ is server-side and is never
// served to the browser, so the function is duplicated here rather than imported.
// If one changes, change the other.
//
//   live      - follow the internal projection, drift and all
//   published - hold what the outside world was told
//
// A URL parameter always wins. Otherwise public-facing outputs hold the published
// schedule and internal ones follow live: the green room wants the truth, the
// lobby wants the plan.
function timeSource({ param, publicFacing, followLive, hasPublished }) {
  if (param === 'live' || param === 'published') return param;
  if (!publicFacing) return 'live';
  if (followLive) return 'live';
  return hasPublished ? 'published' : 'live';
}

const rawScale = Number(ST.opt('scale', 1));
const scale = Number.isFinite(rawScale) && rawScale > 0 ? rawScale : 1;
document.documentElement.style.setProperty('--st-scale', scale);

const el = {
  top: document.getElementById('topStrip'),
  sessionTitle: document.getElementById('sessionTitle'),
  wallClock: document.getElementById('wallClock'),
  digits: document.getElementById('digits'),
  idle: document.getElementById('idle'),
  idleShow: document.getElementById('idleShow'),
  footer: document.getElementById('footer'),
  showTitle: document.getElementById('showTitle'),
  upNext: document.getElementById('upNext'),
  nextTitle: document.getElementById('nextTitle'),
  nextAt: document.getElementById('nextAt'),
  progress: document.getElementById('progress'),
  progressFill: document.getElementById('progressFill'),
  blackout: document.getElementById('blackout'),
  offline: document.getElementById('offline'),
};

// --- tiny DOM helpers -----------------------------------------------------
// The render loop runs every animation frame, so every write is guarded by a
// cache. Touching the DOM only when a value actually changed keeps the paint
// cheap enough to survive on an old laptop driving the lobby screen.
const last = new Map();
function set(key, value, apply) {
  if (last.get(key) === value) return;
  last.set(key, value);
  apply(value);
}
const text = (node, key) => (v) => set(key, v, (x) => { node.textContent = x; });
const show = (node, key) => (v) => set(key, v, (x) => { node.hidden = !x; });
const attr = (node, name, key) => (v) => set(key, v, (x) => { node.setAttribute(name, x); });

// Digits need the colon in its own element so st.css can blink it.
function paintDigits(str) {
  set('digits', str, (s) => {
    el.digits.innerHTML = s.split(':').join('<span class="colon">:</span>');
    // Long readouts (hours, or a time of day with AM/PM) need the narrower ramp
    // or they run off the sides of a wide box.
    el.digits.classList.toggle('wide', s.length > 5);
  });
}

// --- phase ----------------------------------------------------------------
// ST.phase() is countdown maths: anything at or below zero is 'over'. A count-up
// timer starts at zero, so asking ST.phase() about one would paint it red from
// the first second. Derive the phase from the session's own budget instead.
function phaseFor(state, session, mode) {
  if (mode === 'clock') return 'running';          // a wall clock has no wrap-up
  if (mode !== 'countup') return ST.phase(state);

  const budget = session?.duration || 0;
  if (!budget) return 'running';                   // open-ended segment, never scold
  const left = budget - elapsedOf(state);
  if (left <= 0) return 'over';
  if (left <= (session.wrapUp?.red ?? 30)) return 'danger';
  if (left <= (session.wrapUp?.yellow ?? 120)) return 'warning';
  return 'running';
}

// Count-up sessions are seeded with remainingAtStart = 0, so ST.remaining()
// walks negative. Elapsed is simply the mirror of it.
function elapsedOf(state) {
  return -ST.remaining(state);
}

// --- scheduled times ------------------------------------------------------
// IMPORTANT: none of this touches the countdown. The digits on this screen are
// always the real live countdown for whatever is on air, because the audience is
// watching the same segment the speaker is. What holds steady here is the
// SCHEDULE: the clock time printed next to the up-next segment. A rundown is
// padded, and the producer absorbs an overrun by trimming a host block or pulling
// a promo. Moving the printed start time on every internal wobble would announce
// a delay that is about to be absorbed, and would announce it again three more
// times before she finished absorbing it.

// What the outside world was told this session would start at.
function publishedStart(state, id) {
  return state.published?.times?.[id] ?? null;
}

// The internal projection for the next segment: it starts when the live one runs
// out. The server's snapshot in state.projection is the fallback, and the only
// source when nothing is on air.
function liveStart(state, session, at) {
  if (!session) return null;
  if (ST.activeSession(state)) {
    return at + Math.max(0, ST.remaining(state, at)) * 1000;
  }
  const p = (state.projection || []).find((x) => x.id === session.id);
  return p?.projectedStart ?? null;
}

// The clock time to print for a session, from whichever document this output is
// following. Null means there is nothing honest to print, so print nothing: an
// audience screen gets no empty states and no warnings.
function scheduledStart(state, session, at, source) {
  if (!session) return null;
  if (source === 'published') return publishedStart(state, session.id);
  return liveStart(state, session, at);
}

// --- render ---------------------------------------------------------------
function render() {
  const state = ST.store.state;
  const connected = ST.store.connected;

  // Never lands on the program feed: an overlay must not key a red badge over the show.
  el.offline.hidden = transparent || connected;

  // First paint can happen before any state arrives, and before the cache loads.
  if (!state) {
    paintDigits('--:--');
    attr(el.digits, 'data-phase', 'digitsPhase')('idle');
    show(el.idle, 'idleShown')(false);
    show(el.digits, 'digitsShown')(true);
    return;
  }

  const timer = state.timer || {};
  const session = ST.activeSession(state);
  const next = ST.nextSession(state);
  const mode = timer.mode || session?.mode || 'countdown';
  const nowMs = ST.now();

  // --- the countdown, the whole point of this screen ---------------------
  const idle = !session;
  show(el.idle, 'idleShown')(idle);
  show(el.digits, 'digitsShown')(!idle);

  let phase = 'idle';
  let fraction = 0;

  if (idle) {
    // A calm standby state. No zeros, nothing that reads as a live cue.
    text(el.idleShow, 'idleShow')(state.show?.title || 'Stage Time');
  } else if (mode === 'clock') {
    paintDigits(ST.fmtTimeOfDay(nowMs));
    phase = 'running';
  } else if (mode === 'countup') {
    const elapsed = Math.max(0, elapsedOf(state));
    paintDigits(ST.fmtClock(elapsed));
    phase = phaseFor(state, session, mode);
    fraction = session?.duration ? elapsed / session.duration : 0;
  } else {
    // fmtClock already renders overrun as -MM:SS, and the 'over' phase turns it
    // red. The audience sees the same truth the speaker does.
    const rem = ST.remaining(state, nowMs);
    paintDigits(ST.fmtClock(rem));
    phase = phaseFor(state, session, mode);
    fraction = session?.duration ? (session.duration - rem) / session.duration : 0;
  }

  attr(el.digits, 'data-phase', 'digitsPhase')(phase);
  attr(el.digits, 'data-running', 'digitsRunning')(String(Boolean(timer.isRunning)));

  // --- top strip ---------------------------------------------------------
  const titleOn = wantTitle && timer.showSessionInfo !== false && !idle;
  show(el.sessionTitle, 'titleShown')(titleOn);
  if (titleOn) {
    text(el.sessionTitle, 'titleText')(session.title || '');
    // Each session carries its own colour so the room can tell blocks apart
    // at a glance from the back row.
    set('titleColor', session.color || 'var(--accent)', (c) => { el.sessionTitle.style.color = c; });
  }

  const clockOn = wantClock && timer.showClock !== false;
  show(el.wallClock, 'clockShown')(clockOn);
  if (clockOn) text(el.wallClock, 'clockText')(ST.fmtTimeOfDay(nowMs));

  // Nothing left in the strip means no reason to reserve its height.
  show(el.top, 'topShown')(titleOn || clockOn);

  // --- footer: show title plus up next -----------------------------------
  // The show title brands the screen, so it is not tied to the session toggles.
  const showTitleText = state.show?.title || '';
  const showTitleOn = Boolean(showTitleText) && !idle;
  show(el.showTitle, 'showTitleShown')(showTitleOn);
  if (showTitleOn) text(el.showTitle, 'showTitleText')(showTitleText);

  const upNextOn = wantUpNext && timer.showUpNext !== false && Boolean(next);
  show(el.upNext, 'upNextShown')(upNextOn);
  if (upNextOn) {
    text(el.nextTitle, 'nextText')(next.title || '');

    // The up-next timing holds the published schedule by default. The countdown
    // above is untouched by this: it is still the live one.
    const source = timeSource({
      param: timesParam,
      publicFacing: PUBLIC_FACING,
      followLive: timer.publicFollowsLive === true,
      hasPublished: Boolean(state.published?.at),
    });
    const startAt = scheduledStart(state, next, nowMs, source);
    show(el.nextAt, 'nextAtShown')(startAt != null);
    if (startAt != null) text(el.nextAt, 'nextAtText')(ST.fmtTimeOfDay(startAt));
  }

  show(el.footer, 'footerShown')(showTitleOn || upNextOn);

  // --- progress ----------------------------------------------------------
  const progressOn = wantProgress && timer.showProgressBar !== false && !idle && mode !== 'clock';
  show(el.progress, 'progressShown')(progressOn);
  if (progressOn) {
    const pct = Math.max(0, Math.min(1, fraction)) * 100;
    // Round to whole percent: sub-pixel width churn every frame buys nothing.
    set('progressWidth', Math.round(pct), (p) => { el.progressFill.style.width = p + '%'; });
    attr(el.progress, 'data-phase', 'progressPhase')(phase);
  }

  // Operator messages are deliberately absent here. A cue like "wrap up now" or
  // "your fly is down" is between the operator and the speaker, and this screen
  // is facing the audience and the stream.

  // --- blackout ----------------------------------------------------------
  show(el.blackout, 'blackoutShown')(Boolean(timer.blackout));
}

ST.connect();
ST.tick(render);
</script>
</body>
</html>
